name: ci

# Fleet is pure Bash. Two gates: shellcheck over every script, and a smoke
# job that proves the headline guarantee (a foreign claimed edit is blocked).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck (all scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck --version
          # Fail on warnings + errors (the substantive checks). info/style notes
          # are advisory and vary across shellcheck versions, so they don't gate.
          shellcheck --severity=warning install.sh .fleet/bin/*.sh

  smoke:
    name: smoke (init + roster + claim/block)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init + exercise the CLI
        run: |
          set -euo pipefail
          mkdir -p /tmp/fleet-scratch && cp -r . /tmp/fleet-scratch/ && cd /tmp/fleet-scratch

          # read-only views must work with NO session identity (plain shell / CI)
          bash .fleet/bin/fleet.sh init
          bash .fleet/bin/fleet.sh doctor
          bash .fleet/bin/fleet.sh roster

          # the headline guarantee: agent-A claims an area; agent-B's edit of a
          # file under it is hard-blocked (exit 2), while agent-A's own is allowed.
          mkdir -p src/api
          bash .fleet/bin/fleet.sh --id ci-agent-A claim src/api "ci smoke"

          foreign='{"session_id":"ci-agent-B","tool_input":{"file_path":"'"$PWD"'/src/api/auth.ts"}}'
          if printf '%s' "$foreign" | bash .fleet/bin/guard.sh; then
            echo "FAIL: guard did not block a foreign claimed edit"; exit 1
          fi
          echo "OK: guard blocked a foreign claimed edit (exit 2)"

          owner='{"session_id":"ci-agent-A","tool_input":{"file_path":"'"$PWD"'/src/api/auth.ts"}}'
          if printf '%s' "$owner" | bash .fleet/bin/guard.sh; then
            echo "OK: owner edit allowed"
          else
            echo "FAIL: owner edit was blocked"; exit 1
          fi

  selftest:
    name: selftest (retire + brain + collateral + labels + attic + adopt — safety guards bite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the retire + brain selftest
        run: |
          set -euo pipefail
          # Run from the checked-out git repo so the retire dirty-claim NEGATIVE
          # CONTROL actually bites (it needs a real git tree to mark work dirty).
          # State is isolated to a mktemp; the live fleet is never touched.
          bash .fleet/bin/selftest-brain-retire.sh
      - name: Run the collateral selftest (shared-tree fixes bite)
        run: |
          set -euo pipefail
          bash .fleet/bin/selftest-collateral.sh
      - name: Run the label-reservation selftest (atomic agent-N, no duplicate-agent-1)
        run: |
          set -euo pipefail
          # Proves label assignment is atomic (8 concurrent → 8 distinct), stable, reused,
          # and that a duplicate live label fails loud. Hermetic (mktemp state).
          bash .fleet/bin/selftest-labels.sh
      - name: Run the commit-attic selftest (work-loss hardening bites)
        run: |
          set -euo pipefail
          # Proves every commit is auto-backed-up (ref + patch), the pre-reset guard BLOCKS a rewind
          # dropping an un-atticed commit (allows recoverable ones + FORCE escape), and a dropped
          # commit is recoverable. Hermetic (throwaway git repo + mktemp state).
          bash .fleet/bin/selftest-attic.sh
      - name: Run the native-adoption selftest (Trackboard reservation adoption bites)
        run: |
          set -euo pipefail
          # Proves a SIGNED reservation is adopted (identity overlay + mission seed + reservation flip +
          # re-sign), while a forged/tampered one, an ambiguous cwd match, a wrong-status or wrong-host
          # reservation are all REFUSED, and register.sh stays byte-compatible when nothing is adopted.
          # Hermetic (mktemp state + temp HMAC key + mock goalstack); the live fleet is never touched.
          bash .fleet/bin/selftest-adopt.sh

  skills-install:
    name: skills install (install.sh drops every skill into .claude/skills/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh propagates every Fleet skill
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          bash install.sh "$target"

          # Every skill dir under .fleet/skills/ MUST land in the target's
          # .claude/skills/ (this is the whole point of the install skill-copy).
          # Dynamic over the source so a NEW skill is auto-covered.
          rc=0
          for src in .fleet/skills/*/; do
            name="$(basename "$src")"
            if [ -f "$target/.claude/skills/$name/SKILL.md" ]; then
              echo "OK: '$name' skill propagated"
            else
              echo "FAIL: '$name' skill did NOT propagate to .claude/skills/"; rc=1
            fi
          done

          # Explicit asserts for the known skills — guards the case where the glob
          # above matched nothing (a silent no-op would otherwise read as green).
          test -f "$target/.claude/skills/task-manager/SKILL.md"
          test -f "$target/.claude/skills/brain/SKILL.md"
          test -f "$target/.claude/skills/coordinator/SKILL.md"
          test -f "$target/.claude/skills/arm/SKILL.md"
          exit $rc
